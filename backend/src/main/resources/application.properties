spring.application.name=backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Ollama through OpenAI-compatible API
spring.ai.openai.base-url=http://localhost:11434/v1
spring.ai.openai.api-key=ollama

spring.ai.openai.chat.model=llama3.2
spring.ai.openai.embedding.model=nomic-embed-text